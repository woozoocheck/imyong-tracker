<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>임용 진도판</title>
<style>
:root{--bg:#f4f5f9;--card:#fff;--ink:#1c1f2b;--sub:#6b7180;--line:#e6e8ef;--brand:#4b56e0;--brand2:#7b46d8;--good:#1ba672;--chip:#eef0f7;--shadow:0 6px 22px rgba(30,34,60,.07)}
@media (prefers-color-scheme:dark){:root{--bg:#14151b;--card:#1e2029;--ink:#f0f1f6;--sub:#9aa0b0;--line:#2c2f3a;--chip:#262935;--shadow:0 6px 22px rgba(0,0,0,.35)}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding:0 0 60px}
.wrap{max-width:900px;margin:0 auto;padding:0 18px}
header{display:flex;align-items:center;justify-content:space-between;padding:22px 0 6px}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em}
.syncdot{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--sub);background:var(--chip);padding:6px 11px;border-radius:999px}
.dot{width:9px;height:9px;border-radius:50%;background:#c7ccd8}
.dot.on{background:var(--good);box-shadow:0 0 0 3px rgba(27,166,114,.18)}
.dot.off{background:#e0a53b}
.hero{margin-top:14px;border-radius:22px;padding:26px 24px;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero .label{font-size:14px;opacity:.9;font-weight:600}
.hero .dday{font-size:52px;font-weight:900;line-height:1;letter-spacing:-.03em;margin:6px 0 4px}
.hero .date{font-size:14px;opacity:.92}
.hero .editbtn{background:rgba(255,255,255,.2);border:0;color:#fff;font-size:13px;padding:9px 14px;border-radius:12px;cursor:pointer;font-weight:600;margin-top:10px}
.hero .editbtn:hover{background:rgba(255,255,255,.32)}
.hero .rt{text-align:right}.hero .rt .pct{font-size:40px;font-weight:900;line-height:1}.hero .rt .cap{font-size:13px;opacity:.9;margin-top:4px}
/* 상단 모드 전환 */
.modebar{display:flex;gap:8px;background:var(--chip);padding:6px;border-radius:16px;margin-top:16px}
.modebtn{flex:1;border:0;background:transparent;color:var(--sub);font-size:16px;font-weight:800;padding:12px;border-radius:11px;cursor:pointer}
.modebtn.on{background:var(--card);color:var(--ink);box-shadow:0 1px 5px rgba(0,0,0,.12)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.card{background:var(--card);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.card .top{display:flex;justify-content:space-between;align-items:baseline}
.card .name{font-size:17px;font-weight:800}.card .frac{font-size:14px;color:var(--sub);font-weight:600}
.bar{height:12px;background:var(--chip);border-radius:999px;margin-top:12px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .4s ease}
.card .pctlab{font-size:13px;color:var(--sub);margin-top:8px}
.controls{display:flex;gap:10px;margin-top:22px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:8px;background:var(--chip);padding:5px;border-radius:14px}
.tab{border:0;background:transparent;color:var(--sub);font-size:15px;font-weight:700;padding:9px 18px;border-radius:10px;cursor:pointer}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.search input{border:0;outline:0;background:transparent;color:var(--ink);font-size:15px;width:100%}
.search input::placeholder{color:var(--sub)}
.hint{font-size:12.5px;color:var(--sub);margin:16px 2px 6px}
.list{margin-top:4px;display:flex;flex-direction:column;gap:9px}
.row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 15px;cursor:pointer;transition:.12s}
.row:hover{border-color:var(--brand)}
.row.done{background:linear-gradient(90deg,rgba(27,166,114,.10),transparent);border-color:rgba(27,166,114,.35)}
.num{flex:none;width:44px;height:44px;border-radius:50%;background:var(--chip);color:var(--sub);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.row.done .num{background:var(--good);color:#fff}
.title{flex:1;font-size:15.5px;font-weight:600;line-height:1.35}
.row.done .title{color:var(--sub);text-decoration:line-through;text-decoration-color:rgba(120,120,120,.5)}
.check{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;font-size:18px;font-weight:900}
.row.done .check{background:var(--good);border-color:var(--good);color:#fff}
.empty{text-align:center;color:var(--sub);padding:40px 0}
/* 독서 */
.readtop{display:flex;align-items:center;justify-content:space-between;margin-top:18px;gap:12px;flex-wrap:wrap}
.readtop .t1{font-size:15px;font-weight:700}
.readtop .t2{font-size:13px;color:var(--sub)}
.todaychip{background:var(--good);color:#fff;font-weight:800;font-size:13px;padding:8px 14px;border-radius:999px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px;margin-top:14px}
.bcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.14s;display:flex;flex-direction:column}
.bcard:hover{border-color:var(--brand);transform:translateY(-3px);box-shadow:var(--shadow)}
.bcover{width:100%;aspect-ratio:3/4.15;object-fit:cover;background:var(--chip);display:block}
.bcoverph{width:100%;aspect-ratio:3/4.15;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));line-height:1.35}
.bbody{padding:11px 13px 14px}
.btitle{font-size:13.5px;font-weight:700;line-height:1.3;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.bmeta{font-size:11px;color:var(--sub);margin-bottom:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bround{display:inline-block;font-size:10.5px;font-weight:800;color:#fff;background:var(--brand2);padding:2px 8px;border-radius:6px;margin-bottom:9px}
.bbar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.bbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.bpct{font-size:11px;color:var(--sub);margin-top:5px}
.btoday{font-size:11px;color:var(--good);font-weight:800;margin-top:3px}
.foot{text-align:center;color:var(--sub);font-size:12px;margin-top:26px;line-height:1.6}
/* 모달 */
.modal{position:fixed;inset:0;background:rgba(10,12,20,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.show{display:flex}
.sheet{background:var(--card);border-radius:20px;padding:24px;width:100%;max-width:420px;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:19px}.sheet p{margin:0 0 14px;color:var(--sub);font-size:13.5px}
.sheet input[type=date],.sheet input[type=number]{width:100%;font-size:17px;padding:11px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.sheet .btns{display:flex;gap:10px;margin-top:18px}
.sheet button{flex:1;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
.sheet .ok{background:var(--brand);color:#fff}.sheet .cancel{background:var(--chip);color:var(--ink)}
.bkhead{display:flex;gap:14px;margin-bottom:6px}
.bkhead img,.bkhead .ph{width:76px;height:104px;border-radius:9px;object-fit:cover;flex:none;background:var(--chip)}
.bkhead .ph{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;text-align:center;padding:6px;background:linear-gradient(135deg,var(--brand),var(--brand2))}
.bkhead .info{flex:1;min-width:0}
.bkhead .info b{font-size:16px;display:block;line-height:1.3}
.bkhead .info span{font-size:12.5px;color:var(--sub)}
.frow{display:flex;align-items:center;gap:10px;margin-top:10px}
.frow label{width:64px;font-size:14px;font-weight:700;color:var(--sub)}
.roundpick{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.rbtn{border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;font-size:13px;padding:7px 12px;border-radius:9px;cursor:pointer}
.rbtn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.loglist{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.loglist h4{margin:0 0 8px;font-size:13px;color:var(--sub)}
.logitem{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.logitem .x{border:0;background:transparent;color:#d33;cursor:pointer;font-size:15px}
.sectionhide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📚 임용 진도판</h1>
    <div class="syncdot"><span id="dot" class="dot"></span><span id="syncText">연결 중…</span></div>
  </header>
  <div class="hero">
    <div>
      <div class="label">시험까지</div>
      <div class="dday" id="dday">D-—</div>
      <div class="date" id="examDate">시험 날짜를 정해주세요</div>
      <button class="editbtn" id="editDate">📅 시험 날짜 설정</button>
    </div>
    <div class="rt"><div class="pct" id="overallPct">0%</div><div class="cap"><span id="overallDone">0</span> / <span id="overallTotal">0</span>강 완료</div></div>
  </div>

  <div class="modebar">
    <button class="modebtn on" id="modeLec">🎬 강의</button>
    <button class="modebtn" id="modeBook">📖 독서</button>
  </div>

  <!-- 강의 -->
  <section id="secLec">
    <div class="cards" id="cards"></div>
    <div class="controls">
      <div class="tabs" id="tabs"></div>
      <div class="search">🔎<input id="search" placeholder="강의 제목·번호 검색"></div>
    </div>
    <div class="hint">강의를 다 보면 오른쪽을 눌러 <b>체크 ✓</b> — 윈도우·맥·폰 어디서 체크해도 자동으로 같이 반영돼요.</div>
    <div class="list" id="list"></div>
  </section>

  <!-- 독서 -->
  <section id="secBook" class="sectionhide">
    <div class="readtop">
      <div><div class="t1">📖 오늘의 독서</div><div class="t2">책을 눌러 <b>오늘 읽은 쪽수·회독</b>을 기록하세요</div></div>
      <div class="todaychip" id="todayChip">오늘 0쪽</div>
    </div>
    <div class="bgrid" id="bgrid"></div>
  </section>

  <div class="foot" id="foot"></div>
</div>

<!-- 시험날짜 모달 -->
<div class="modal" id="dateModal">
  <div class="sheet">
    <h3>시험 날짜 설정</h3><p>임용 1차 시험 날짜를 골라주세요. D-day가 여기서 계산돼요.</p>
    <input type="date" id="dateInput">
    <div class="btns"><button class="cancel" id="cancelDate">취소</button><button class="ok" id="saveDate">저장</button></div>
  </div>
</div>

<!-- 책 기록 모달 -->
<div class="modal" id="bookModal">
  <div class="sheet">
    <div class="bkhead" id="bkHead"></div>
    <div class="bar" style="margin-top:12px"><i id="bkBar" style="width:0%"></i></div>
    <div class="bpct" id="bkProg" style="margin-top:7px"></div>
    <div style="margin-top:16px;font-weight:800;font-size:15px">오늘 읽은 범위 기록</div>
    <div style="font-size:12.5px;color:var(--sub);margin-top:2px">회독을 고르고, 오늘 읽은 시작~끝 쪽을 넣으세요.</div>
    <div class="roundpick" id="roundPick"></div>
    <div class="frow"><label>시작 쪽</label><input type="number" id="lgFrom" min="1" inputmode="numeric"></div>
    <div class="frow"><label>끝 쪽</label><input type="number" id="lgTo" min="1" inputmode="numeric"></div>
    <div class="btns"><button class="cancel" id="closeBook">닫기</button><button class="ok" id="saveLog">기록 저장</button></div>
    <div class="loglist" id="logList"></div>
  </div>
</div>

const BOOKS_FALLBACK = [{"id": "santa", "title": "SANTA 설보연 교육학 단권화 Thin", "author": "설보연", "publisher": "지스쿨(G스쿨)", "total_pages": 360, "category": "교육학", "sort_order": 1}, {"id": "hwabeop_pyeon", "title": "화법교육편 (박노송의 神의 한수)", "author": "박노송", "publisher": "G스쿨", "total_pages": 228, "category": "전공-화법", "sort_order": 2}, {"id": "hwabeop_isotong", "title": "화법 교육을 위한 의사소통 이론 (3판)", "author": "박재현", "publisher": "사회평론아카데미", "total_pages": 380, "category": "전공-화법", "sort_order": 3}, {"id": "dokseo_pyeon", "title": "독서교육편 (박노송의 神의 한수)", "author": "박노송", "publisher": "G스쿨", "total_pages": 361, "category": "전공-독서", "sort_order": 4}, {"id": "dokseo_ron", "title": "독서 교육론 (개정판)", "author": "천경록·김혜정·류보라", "publisher": "역락", "total_pages": 526, "category": "전공-독서", "sort_order": 5}, {"id": "jakmun_pyeon", "title": "작문교육편 (박노송의 神의 한수)", "author": "박노송", "publisher": "G스쿨", "total_pages": 278, "category": "전공-작문", "sort_order": 6}, {"id": "jakmun_ron", "title": "작문 교육론 (개정판)", "author": "박영민 외 6인", "publisher": "역락", "total_pages": 592, "category": "전공-작문", "sort_order": 7}, {"id": "munbeop", "title": "한국어 문법 총론 I (개정판)", "author": "구본관 외", "publisher": "집문당", "total_pages": 452, "category": "전공-문법", "sort_order": 8}, {"id": "gukeosa", "title": "쉽게 풀어 쓴 국어사 개론", "author": "신승용", "publisher": "집문당", "total_pages": 270, "category": "전공-국어사", "sort_order": 9}];
const SUBJECTS=Object.keys(LECTURES_FALLBACK);
const LKEY="imyong_progress_v1", DKEY="imyong_examdate_v1", CKEY="imyong_lectures_v1", BKEY="imyong_books_v1", GKEY="imyong_logs_v1";
let LECT=load(CKEY,LECTURES_FALLBACK);
let BOOKS=load(BKEY,BOOKS_FALLBACK);
let LOGS=load(GKEY,[]);
let state=load(LKEY,{}), examDate=localStorage.getItem(DKEY)||"", mode="lectures", curSubject=SUBJECTS[0], query="", curBook=null, curRound=1, sb=null, online=false;
if(/mode=book/.test(location.search)||/^#books?$/.test(location.hash))mode="books";
function load(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function key(s,n){return s+"|"+n}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function todayStr(){const d=new Date(),z=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`}
function groupLectures(rows){const g={};SUBJECTS.forEach(s=>g[s]=[]);(rows||[]).forEach(r=>{(g[r.subject]=g[r.subject]||[]).push({n:r.number,t:r.title})});Object.keys(g).forEach(s=>g[s].sort((a,b)=>parseInt(a.n)-parseInt(b.n)));return g}

async function loadLectures(){try{const {data,error}=await sb.from("imyong_lectures").select("subject,number,title");if(error)throw error;if(data&&data.length){LECT=groupLectures(data);save(CKEY,LECT)}}catch(e){console.warn("강의목록 로드 실패",e)}}
async function loadBooks(){try{const {data,error}=await sb.from("imyong_books").select("*").order("sort_order");if(error)throw error;if(data&&data.length){BOOKS=data;save(BKEY,BOOKS)}}catch(e){console.warn("책 로드 실패",e)}}
async function loadLogs(){try{const {data,error}=await sb.from("imyong_reading_log").select("*").order("id");if(error)throw error;LOGS=data||[];save(GKEY,LOGS)}catch(e){console.warn("기록 로드 실패",e)}}

async function initSB(){
  if(!SUPABASE_URL.startsWith("http")||SUPABASE_ANON.length<20){setSync(false,"이 기기에만 저장");render();return}
  try{
    sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
    const {data:prog,error:e1}=await sb.from("imyong_progress").select("subject,number,done");if(e1)throw e1;
    state={};(prog||[]).forEach(r=>{if(r.done)state[key(r.subject,r.number)]=true});save(LKEY,state);
    await Promise.all([loadLectures(),loadBooks(),loadLogs()]);
    const {data:cfg}=await sb.from("imyong_config").select("exam_date").eq("id",1).maybeSingle();
    if(cfg&&cfg.exam_date){examDate=cfg.exam_date;localStorage.setItem(DKEY,examDate)}
    online=true;setSync(true,"동기화됨");
    sb.channel("imyong")
      .on("postgres_changes",{event:"*",schema:"public",table:"imyong_progress"},p=>{const r=p.new||p.old;if(!r)return;if(p.eventType==="DELETE"||!p.new.done)delete state[key(r.subject,r.number)];else state[key(p.new.subject,p.new.number)]=true;save(LKEY,state);render()})
      .on("postgres_changes",{event:"*",schema:"public",table:"imyong_lectures"},async()=>{await loadLectures();render()})
      .on("postgres_changes",{event:"*",schema:"public",table:"imyong_books"},async()=>{await loadBooks();render();if(curBook)openBook(curBook)})
      .on("postgres_changes",{event:"*",schema:"public",table:"imyong_reading_log"},async()=>{await loadLogs();render();if(curBook)openBook(curBook)})
      .on("postgres_changes",{event:"*",schema:"public",table:"imyong_config"},p=>{if(p.new&&p.new.exam_date){examDate=p.new.exam_date;localStorage.setItem(DKEY,examDate);renderDday()}})
      .subscribe();
    render();
  }catch(err){console.warn(err);setSync(false,"오프라인(이 기기 저장)");render()}
}
function setSync(ok,txt){online=ok;document.getElementById("dot").className="dot "+(ok?"on":"off");document.getElementById("syncText").textContent=txt}
async function pushProgress(s,n,done){if(!sb||!online)return;try{await sb.from("imyong_progress").upsert({subject:s,number:n,done,updated_at:new Date().toISOString()},{onConflict:"subject,number"})}catch(e){setSync(false,"오프라인(이 기기 저장)")}}
async function pushExamDate(d){if(!sb||!online)return;try{await sb.from("imyong_config").upsert({id:1,exam_date:d})}catch(e){}}

/* ===== 강의 ===== */
function counts(){const r={};let td=0,tt=0;for(const s of SUBJECTS){const arr=LECT[s]||[];let done=0;arr.forEach(l=>{if(state[key(s,l.n)])done++});r[s]={done,total:arr.length};td+=done;tt+=arr.length}r.__all__={done:td,total:tt};return r}
function renderDday(){const el=document.getElementById("dday"),de=document.getElementById("examDate");if(!examDate){el.textContent="D-—";de.textContent="시험 날짜를 정해주세요";return}const t=new Date();t.setHours(0,0,0,0);const ex=new Date(examDate+"T00:00:00");const diff=Math.round((ex-t)/86400000);el.textContent=diff>0?("D-"+diff):diff===0?"D-DAY":("D+"+(-diff));const wd=["일","월","화","수","목","금","토"][ex.getDay()];de.textContent=`${ex.getFullYear()}. ${ex.getMonth()+1}. ${ex.getDate()}. (${wd}) 시험`}
function renderStats(){const c=counts();document.getElementById("overallDone").textContent=c.__all__.done;document.getElementById("overallTotal").textContent=c.__all__.total;document.getElementById("overallPct").textContent=(c.__all__.total?Math.round(c.__all__.done/c.__all__.total*100):0)+"%";const cards=document.getElementById("cards");cards.innerHTML="";for(const s of SUBJECTS){const{done,total}=c[s];const pct=total?Math.round(done/total*100):0;const d=document.createElement("div");d.className="card";d.innerHTML=`<div class="top"><div class="name">${s}</div><div class="frac">${done} / ${total}강</div></div><div class="bar"><i style="width:${pct}%"></i></div><div class="pctlab">${pct}% 완료 · ${total-done}강 남음</div>`;cards.appendChild(d)}}
function renderTabs(){const t=document.getElementById("tabs");t.innerHTML="";const c=counts();for(const s of SUBJECTS){const b=document.createElement("button");b.className="tab"+(s===curSubject?" on":"");b.textContent=`${s} ${c[s].done}/${c[s].total}`;b.onclick=()=>{curSubject=s;query="";document.getElementById("search").value="";render()};t.appendChild(b)}}
function renderList(){const list=document.getElementById("list");list.innerHTML="";const q=query.trim().toLowerCase();const items=(LECT[curSubject]||[]).filter(l=>!q||(l.n+" "+l.t).toLowerCase().includes(q));if(!items.length){list.innerHTML='<div class="empty">'+(q?'검색 결과가 없어요':'강의를 불러오는 중…')+'</div>';return}for(const l of items){const done=!!state[key(curSubject,l.n)];const row=document.createElement("div");row.className="row"+(done?" done":"");row.innerHTML=`<div class="num">${l.n}</div><div class="title">${esc(l.t)}</div><div class="check">✓</div>`;row.onclick=()=>toggle(curSubject,l.n);list.appendChild(row)}}
function toggle(s,n){const k=key(s,n),now=!state[k];if(now)state[k]=true;else delete state[k];save(LKEY,state);render();pushProgress(s,n,now)}

/* ===== 독서 ===== */
function bookLogs(id){return LOGS.filter(l=>l.book_id===id).sort((a,b)=>a.id-b.id)}
function bookState(b){const ls=bookLogs(b.id);const round=ls.length?Math.max(...ls.map(l=>l.round||1)):1;const inR=ls.filter(l=>(l.round||1)===round);const page=inR.length?Math.max(...inR.map(l=>l.page_to||0)):0;const pct=b.total_pages?Math.min(100,Math.round(page/b.total_pages*100)):0;const today=todayStr();const todayPages=ls.filter(l=>l.log_date===today).reduce((s,l)=>s+Math.max(0,((l.page_to||0)-(l.page_from||0)+1)),0);return{round,page,pct,todayPages,ls}}
function coverCell(b,cls){if(b.cover_url)return `<img class="${cls}" src="${esc(b.cover_url)}" onerror="this.outerHTML='<div class=\'${cls==='bcover'?'bcoverph':'ph'}\'>'+this.alt+'</div>'" alt="${esc(b.title)}">`;return `<div class="${cls==='bcover'?'bcoverph':'ph'}">${esc(b.title)}</div>`}
function renderBooks(){
  const grid=document.getElementById("bgrid");grid.innerHTML="";
  let todayTotal=0;
  BOOKS.forEach(b=>{const st=bookState(b);todayTotal+=st.todayPages;
    const c=document.createElement("div");c.className="bcard";
    c.innerHTML=`${coverCell(b,'bcover')}<div class="bbody">
      <div class="btitle">${esc(b.title)}</div>
      <div class="bmeta">${esc(b.author||'')}${b.publisher?' · '+esc(b.publisher):''}</div>
      <span class="bround">${st.round}회독</span>
      <div class="bbar"><i style="width:${st.pct}%"></i></div>
      <div class="bpct">${st.page} / ${b.total_pages||'?'}쪽 · ${st.pct}%</div>
      ${st.todayPages?`<div class="btoday">오늘 +${st.todayPages}쪽</div>`:''}</div>`;
    c.onclick=()=>openBook(b);grid.appendChild(c)});
  document.getElementById("todayChip").textContent=`오늘 ${todayTotal}쪽`;
}
function openBook(b){
  curBook=b;const st=bookState(b);curRound=st.round;
  const m=document.getElementById("bookModal");
  document.getElementById("bkHead").innerHTML=`${coverCell(b,'bkimg')}<div class="info"><b>${esc(b.title)}</b><span>${esc(b.author||'')}${b.publisher?' · '+esc(b.publisher):''} · 총 ${b.total_pages||'?'}쪽</span></div>`;
  document.getElementById("bkBar").style.width=st.pct+"%";
  document.getElementById("bkProg").textContent=`${st.round}회독 · ${st.page} / ${b.total_pages||'?'}쪽 (${st.pct}%)`;
  // 회독 선택 버튼 (1~현재+1)
  const rp=document.getElementById("roundPick");rp.innerHTML="";
  const maxR=Math.max(st.round+1,2);
  for(let r=1;r<=maxR;r++){const btn=document.createElement("button");btn.className="rbtn"+(r===curRound?" on":"");btn.textContent=r+"회독";btn.onclick=()=>{curRound=r;renderRoundPick();refreshFromDefault()};rp.appendChild(btn)}
  refreshFromDefault();
  renderLogList(b);
  m.classList.add("show");
}
function renderRoundPick(){document.querySelectorAll("#roundPick .rbtn").forEach((btn,i)=>btn.classList.toggle("on",i+1===curRound))}
function refreshFromDefault(){// 선택 회독의 마지막 쪽 다음부터 제안
  const inR=bookLogs(curBook.id).filter(l=>(l.round||1)===curRound);const last=inR.length?Math.max(...inR.map(l=>l.page_to||0)):0;
  document.getElementById("lgFrom").value=last+1;document.getElementById("lgTo").value="";}
function renderLogList(b){const ls=bookLogs(b.id).slice().reverse().slice(0,12);const el=document.getElementById("logList");
  if(!ls.length){el.innerHTML='<h4>기록</h4><div style="font-size:13px;color:var(--sub)">아직 기록이 없어요.</div>';return}
  el.innerHTML='<h4>최근 기록</h4>'+ls.map(l=>`<div class="logitem"><span>${l.log_date} · <b>${l.page_from}~${l.page_to}쪽</b> (${l.round||1}회독)</span><button class="x" data-id="${l.id}">🗑</button></div>`).join("");
  el.querySelectorAll(".x").forEach(x=>x.onclick=()=>delLog(x.dataset.id));
}
async function saveLog(){
  const from=parseInt(document.getElementById("lgFrom").value),to=parseInt(document.getElementById("lgTo").value);
  if(!from||!to||to<from){alert("시작 쪽과 끝 쪽을 확인해주세요.");return}
  const rec={book_id:curBook.id,log_date:todayStr(),page_from:from,page_to:to,round:curRound};
  // 낙관적 반영
  const tmp={...rec,id:"tmp"+Date.now()};LOGS.push(tmp);save(GKEY,LOGS);renderLogList(curBook);renderBooks();
  if(sb&&online){try{const {data}=await sb.from("imyong_reading_log").insert(rec).select().single();if(data){LOGS=LOGS.filter(l=>l.id!==tmp.id);LOGS.push(data);save(GKEY,LOGS)}}catch(e){console.warn(e)}}
  const st=bookState(curBook);document.getElementById("bkBar").style.width=st.pct+"%";document.getElementById("bkProg").textContent=`${st.round}회독 · ${st.page} / ${curBook.total_pages||'?'}쪽 (${st.pct}%)`;
  refreshFromDefault();renderLogList(curBook);renderBooks();
}
async function delLog(id){if(!confirm("이 기록을 지울까요?"))return;LOGS=LOGS.filter(l=>String(l.id)!==String(id));save(GKEY,LOGS);renderLogList(curBook);renderBooks();
  if(sb&&online&&!String(id).startsWith("tmp")){try{await sb.from("imyong_reading_log").delete().eq("id",id)}catch(e){}}
  const st=bookState(curBook);document.getElementById("bkBar").style.width=st.pct+"%";document.getElementById("bkProg").textContent=`${st.round}회독 · ${st.page} / ${curBook.total_pages||'?'}쪽 (${st.pct}%)`;
}

function render(){
  renderDday();renderStats();renderTabs();renderList();renderBooks();
  document.getElementById("secLec").className=mode==="lectures"?"":"sectionhide";
  document.getElementById("secBook").className=mode==="books"?"":"sectionhide";
  document.getElementById("modeLec").className="modebtn"+(mode==="lectures"?" on":"");
  document.getElementById("modeBook").className="modebtn"+(mode==="books"?" on":"");
}

/* 이벤트 */
document.getElementById("modeLec").onclick=()=>{mode="lectures";render()};
document.getElementById("modeBook").onclick=()=>{mode="books";render()};
document.getElementById("editDate").onclick=()=>{document.getElementById("dateInput").value=examDate||"";document.getElementById("dateModal").classList.add("show")};
document.getElementById("cancelDate").onclick=()=>document.getElementById("dateModal").classList.remove("show");
document.getElementById("saveDate").onclick=()=>{const v=document.getElementById("dateInput").value;if(v){examDate=v;localStorage.setItem(DKEY,v);pushExamDate(v);renderDday()}document.getElementById("dateModal").classList.remove("show")};
document.getElementById("dateModal").onclick=e=>{if(e.target.id==="dateModal")document.getElementById("dateModal").classList.remove("show")};
document.getElementById("closeBook").onclick=()=>{document.getElementById("bookModal").classList.remove("show");curBook=null};
document.getElementById("bookModal").onclick=e=>{if(e.target.id==="bookModal"){document.getElementById("bookModal").classList.remove("show");curBook=null}};
document.getElementById("saveLog").onclick=saveLog;
document.getElementById("search").addEventListener("input",e=>{query=e.target.value;renderList()});
document.getElementById("foot").innerHTML="강의는 맥 <b>임용강의 앱</b>으로 보고, 여기선 진도·독서를 기록해요. · 모든 기록은 자동 동기화됩니다.";
render();initSB();setInterval(renderDday,3600000);
</script>
