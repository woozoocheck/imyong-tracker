<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>임용 진도판</title>
<style>
:root{--bg:#f4f5f9;--card:#fff;--ink:#1c1f2b;--sub:#6b7180;--line:#e6e8ef;--brand:#4b56e0;--brand2:#7b46d8;--good:#1ba672;--chip:#eef0f7;--shadow:0 6px 22px rgba(30,34,60,.07)}
@media (prefers-color-scheme:dark){:root{--bg:#14151b;--card:#1e2029;--ink:#f0f1f6;--sub:#9aa0b0;--line:#2c2f3a;--chip:#262935;--shadow:0 6px 22px rgba(0,0,0,.35)}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding:0 0 60px}
.wrap{max-width:900px;margin:0 auto;padding:0 18px}
header{display:flex;align-items:center;justify-content:space-between;padding:22px 0 6px}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em;cursor:pointer}
.syncdot{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--sub);background:var(--chip);padding:6px 11px;border-radius:999px}
.dot{width:9px;height:9px;border-radius:50%;background:#c7ccd8}
.dot.on{background:var(--good);box-shadow:0 0 0 3px rgba(27,166,114,.18)}
.dot.off{background:#e0a53b}
.hero{margin-top:14px;border-radius:22px;padding:26px 24px;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero .label{font-size:14px;opacity:.9;font-weight:600}
.hero .dday{font-size:52px;font-weight:900;line-height:1;letter-spacing:-.03em;margin:6px 0 4px}
.hero .date{font-size:14px;opacity:.92}
.hero .editbtn{background:rgba(255,255,255,.2);border:0;color:#fff;font-size:13px;padding:9px 14px;border-radius:12px;cursor:pointer;font-weight:600;margin-top:10px}
.hero .rt{text-align:right}.hero .rt .pct{font-size:40px;font-weight:900;line-height:1}.hero .rt .cap{font-size:13px;opacity:.9;margin-top:4px}
.modebar{display:flex;gap:8px;background:var(--chip);padding:6px;border-radius:16px;margin-top:16px}
.modebtn{flex:1;border:0;background:transparent;color:var(--sub);font-size:16px;font-weight:800;padding:12px;border-radius:11px;cursor:pointer}
.modebtn.on{background:var(--card);color:var(--ink);box-shadow:0 1px 5px rgba(0,0,0,.12)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.card{background:var(--card);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.card .top{display:flex;justify-content:space-between;align-items:baseline}
.card .name{font-size:17px;font-weight:800}.card .frac{font-size:14px;color:var(--sub);font-weight:600}
.bar{height:12px;background:var(--chip);border-radius:999px;margin-top:12px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .4s ease}
.card .pctlab{font-size:13px;color:var(--sub);margin-top:8px}
.controls{display:flex;gap:10px;margin-top:22px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:8px;background:var(--chip);padding:5px;border-radius:14px}
.tab{border:0;background:transparent;color:var(--sub);font-size:15px;font-weight:700;padding:9px 18px;border-radius:10px;cursor:pointer}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.search input{border:0;outline:0;background:transparent;color:var(--ink);font-size:15px;width:100%}
.search input::placeholder{color:var(--sub)}
.hint{font-size:12.5px;color:var(--sub);margin:16px 2px 6px}
.list{margin-top:4px;display:flex;flex-direction:column;gap:9px}
.row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 15px;cursor:pointer;transition:.12s}
.row:hover{border-color:var(--brand)}
.row.done{background:linear-gradient(90deg,rgba(27,166,114,.10),transparent);border-color:rgba(27,166,114,.35)}
.num{flex:none;width:44px;height:44px;border-radius:50%;background:var(--chip);color:var(--sub);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.row.done .num{background:var(--good);color:#fff}
.title{flex:1;font-size:15.5px;font-weight:600;line-height:1.35}
.row.done .title{color:var(--sub);text-decoration:line-through;text-decoration-color:rgba(120,120,120,.5)}
.check{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;font-size:18px;font-weight:900}
.row.done .check{background:var(--good);border-color:var(--good);color:#fff}
.empty{text-align:center;color:var(--sub);padding:40px 0}
/* 독서 그리드 */
.readtop{display:flex;align-items:center;justify-content:space-between;margin-top:18px;gap:12px;flex-wrap:wrap}
.readtop .t1{font-size:15px;font-weight:700}.readtop .t2{font-size:13px;color:var(--sub)}
.todaychip{background:var(--good);color:#fff;font-weight:800;font-size:13px;padding:8px 14px;border-radius:999px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px;margin-top:14px}
.bcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.14s;display:flex;flex-direction:column}
.bcard:hover{border-color:var(--brand);transform:translateY(-3px);box-shadow:var(--shadow)}
.bcover{width:100%;aspect-ratio:3/4.15;object-fit:cover;background:var(--chip);display:block}
.bcoverph{width:100%;aspect-ratio:3/4.15;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));line-height:1.35}
.bbody{padding:11px 13px 14px}
.btitle{font-size:13.5px;font-weight:700;line-height:1.3;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.bmeta{font-size:11px;color:var(--sub);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bpct{font-size:11.5px;color:var(--sub);margin-top:7px;font-weight:600}.btoday{font-size:11px;color:var(--good);font-weight:800;margin-top:3px}
/* 히트맵 */
.heat{display:flex;height:24px;border-radius:8px;overflow:hidden;background:var(--chip)}
.heat>span{flex:1 1 0;min-width:0}
.heatmini{display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--chip);margin-top:9px}
.heatmini>span{flex:1 1 0;min-width:0}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:11px;font-size:11.5px;color:var(--sub)}
.legend i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.lvlrow{display:flex;align-items:center;gap:12px;margin-top:10px}
.lvlrow .lb{width:52px;font-size:13.5px;font-weight:800}
.lvlrow .bar{flex:1;margin-top:0;height:10px}
.lvlrow .pc{width:104px;text-align:right;font-size:12px;color:var(--sub);font-weight:600}
.ruler{position:relative;height:22px;margin-top:3px}
.ruler .tick{position:absolute;top:0;width:1px;height:5px;background:var(--sub);opacity:.35}
.ruler .tick.maj{height:9px;opacity:.65}
.ruler .tlab{position:absolute;top:10px;font-size:10px;color:var(--sub);transform:translateX(-50%);white-space:nowrap}
.ruler .tlab.end{transform:translateX(-100%)}
.tocrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.tocrow:last-child{border-bottom:0}
.tocdot{width:12px;height:12px;border-radius:3px;flex:none}
.toct{flex:1;font-weight:600;line-height:1.3}
.tocp{font-size:12px;color:var(--sub);white-space:nowrap}
.tocb{font-size:11px;font-weight:800;color:var(--sub);background:var(--chip);padding:3px 8px;border-radius:6px;min-width:38px;text-align:center;flex:none}
.tocb.done{color:#fff;background:var(--good)}.tocb.zero{opacity:.45}
/* 책 상세 */
.back{border:0;background:var(--chip);color:var(--ink);font-size:14px;font-weight:700;padding:9px 15px;border-radius:11px;cursor:pointer;margin-top:16px}
.dethead{display:flex;gap:18px;margin-top:16px;align-items:flex-start}
.dethead img,.dethead .ph{width:104px;height:142px;border-radius:12px;object-fit:cover;flex:none;background:var(--chip);box-shadow:var(--shadow)}
.dethead .ph{display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:10px;font-size:13px;font-weight:800;background:linear-gradient(135deg,var(--brand),var(--brand2))}
.dethead .di b{font-size:20px;line-height:1.3;display:block}
.dethead .di span{font-size:13px;color:var(--sub);display:block;margin-top:4px}
.detbox{background:var(--card);border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-top:16px}
.detbox .hd{font-weight:800;font-size:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline}
.detbox .hd .sum{font-size:13px;color:var(--good);font-weight:800}
.logcard h3{margin:0 0 3px;font-size:18px}
.logcard .desc{font-size:13px;color:var(--sub);margin-bottom:6px}
.field{margin-top:12px}
.field>label{display:block;font-size:13px;font-weight:800;color:var(--sub);margin-bottom:6px}
.field input{width:100%;font-size:19px;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit}
.pagepair{display:flex;align-items:center;gap:10px}.pagepair input{text-align:center}.pagepair .tilde{font-size:20px;color:var(--sub);font-weight:800}
.chappreview{margin-top:12px;font-size:13.5px;color:var(--brand);font-weight:700;min-height:18px}
@media (prefers-color-scheme:dark){.chappreview{color:#aab2ff}}
.savebtn{width:100%;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:800;cursor:pointer;background:var(--brand);color:#fff;margin-top:14px}
.savebtn:active{transform:scale(.99)}
.histitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.histitem .hl{font-size:14px}.histitem .hl .hd2{color:var(--sub);font-size:12px}.histitem .hl .hc{color:var(--brand);font-size:12px;font-weight:700;margin-top:2px}
@media (prefers-color-scheme:dark){.histitem .hl .hc{color:#aab2ff}}
.histitem .x{border:0;background:rgba(220,60,60,.12);color:#d33;cursor:pointer;font-size:15px;border-radius:8px;width:32px;height:32px;flex:none}
.foot{text-align:center;color:var(--sub);font-size:12px;margin-top:26px;line-height:1.6}
.modal{position:fixed;inset:0;background:rgba(10,12,20,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.show{display:flex}
.sheet{background:var(--card);border-radius:20px;padding:24px;width:100%;max-width:360px;box-shadow:var(--shadow)}
.sheet h3{margin:0 0 4px;font-size:19px}.sheet p{margin:0 0 16px;color:var(--sub);font-size:13.5px}
.sheet input[type=date]{width:100%;font-size:17px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.sheet .btns{display:flex;gap:10px;margin-top:18px}
.sheet button{flex:1;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
.sheet .ok{background:var(--brand);color:#fff}.sheet .cancel{background:var(--chip);color:var(--ink)}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="homeTitle">📚 임용 진도판</h1>
    <div class="syncdot"><span id="dot" class="dot"></span><span id="syncText">연결 중…</span></div>
  </header>
  <div class="hero">
    <div>
      <div class="label">시험까지</div>
      <div class="dday" id="dday">D-—</div>
      <div class="date" id="examDate">시험 날짜를 정해주세요</div>
      <button class="editbtn" id="editDate">📅 시험 날짜 설정</button>
    </div>
    <div class="rt"><div class="pct" id="overallPct">0%</div><div class="cap"><span id="overallDone">0</span> / <span id="overallTotal">0</span>강 완료</div></div>
  </div>
  <div class="modebar" id="modebar">
    <button class="modebtn on" id="modeLec">🎬 강의</button>
    <button class="modebtn" id="modeBook">📖 독서</button>
  </div>
  <section id="secLec">
    <div class="cards" id="cards"></div>
    <div class="controls"><div class="tabs" id="tabs"></div><div class="search">🔎<input id="search" placeholder="강의 제목·번호 검색"></div></div>
    <div class="hint">강의를 다 보면 오른쪽을 눌러 <b>체크 ✓</b> — 윈도우·맥·폰 어디서 체크해도 자동으로 같이 반영돼요.</div>
    <div class="list" id="list"></div>
  </section>
  <section id="secBook" class="hide">
    <div id="bookGrid">
      <div class="readtop"><div><div class="t1">📖 책장</div><div class="t2">책을 눌러 오늘 읽은 만큼 기록하세요</div></div><div class="todaychip" id="todayChip">오늘 0쪽</div></div>
      <div class="bgrid" id="bgrid"></div>
    </div>
    <div id="bookDetail" class="hide"></div>
  </section>
  <div class="foot" id="foot"></div>
</div>
<div class="modal" id="dateModal">
  <div class="sheet">
    <h3>시험 날짜 설정</h3><p>임용 1차 시험 날짜를 골라주세요. D-day가 여기서 계산돼요.</p>
    <input type="date" id="dateInput">
    <div class="btns"><button class="cancel" id="cancelDate">취소</button><button class="ok" id="saveDate">저장</button></div>
  </div>
</div>

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function todayStr(){const d=new Date(),z=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`}
function groupLectures(rows){const g={};SUBJECTS.forEach(s=>g[s]=[]);(rows||[]).forEach(r=>{(g[r.subject]=g[r.subject]||[]).push({n:r.number,t:r.title})});Object.keys(g).forEach(s=>g[s].sort((a,b)=>parseInt(a.n)-parseInt(b.n)));return g}

async function loadLectures(){try{const {data,error}=await sb.from("imyong_lectures").select("subject,number,title");if(error)throw error;if(data&&data.length){LECT=groupLectures(data);save(CKEY,LECT)}}catch(e){console.warn(e)}}
async function loadBooks(){try{const {data,error}=await sb.from("imyong_books").select("*").order("sort_order");if(error)throw error;if(data&&data.length){BOOKS=data;save(BKEY,BOOKS)}}catch(e){console.warn(e)}}
async function loadLogs(){try{const {data,error}=await sb.from("imyong_reading_log").select("*").order("id");if(error)throw error;LOGS=data||[];save(GKEY,LOGS)}catch(e){console.warn(e)}}
async function initSB(){
  if(!SUPABASE_URL.startsWith("http")||SUPABASE_ANON.length<20){setSync(false,"이 기기에만 저장");route();return}
  try{
    sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
    const {data:prog,error:e1}=await sb.from("imyong_progress").select("subject,number,done");if(e1)throw e1;
    state={};(prog||[]).forEach(r=>{if(r.done)state[key(r.subject,r.number)]=true});save(LKEY,state);
    await Promise.all([loadLectures(),loadBooks(),loadLogs()]);
    const {data:cfg}=await sb.from("imyong_config").select("exam_date").eq("id",1).maybeSingle();
    if(cfg&&cfg.exam_date){examDate=cfg.exam_date;localStorage.setItem(DKEY,examDate)}
    online=true;setSync(true,"동기화됨");
    sb.channel("imyong")
      .on("postgres_changes",{event:"*",schema:"public",table:"imyong_progress"},p=>{const r=p.new||p.old;if(!r)return;if(p.eventType==="DELETE"||!p.new.done)delete state[key(r.subject,r.number)];else state[key(p.new.subject,p.new.number)]=true;save(LKEY,state);renderLec()})
      .on("postgres_changes",{event:"*",schema:"public",table:"imyong_lectures"},async()=>{await loadLectures();renderLec()})
      .on("postgres_changes",{event:"*",schema:"public",table:"imyong_books"},async()=>{await loadBooks();route()})
      .on("postgres_changes",{event:"*",schema:"public",table:"imyong_reading_log"},async()=>{await loadLogs();route()})
      .on("postgres_changes",{event:"*",schema:"public",table:"imyong_config"},p=>{if(p.new&&p.new.exam_date){examDate=p.new.exam_date;localStorage.setItem(DKEY,examDate);renderDday()}})
      .subscribe();
    route();
  }catch(err){console.warn(err);setSync(false,"오프라인(이 기기 저장)");route()}
}
function setSync(ok,txt){online=ok;document.getElementById("dot").className="dot "+(ok?"on":"off");document.getElementById("syncText").textContent=txt}
async function pushProgress(s,n,done){if(!sb||!online)return;try{await sb.from("imyong_progress").upsert({subject:s,number:n,done,updated_at:new Date().toISOString()},{onConflict:"subject,number"})}catch(e){setSync(false,"오프라인(이 기기 저장)")}}
async function pushExamDate(d){if(!sb||!online)return;try{await sb.from("imyong_config").upsert({id:1,exam_date:d})}catch(e){}}

/* 강의 */
function counts(){const r={};let td=0,tt=0;for(const s of SUBJECTS){const arr=LECT[s]||[];let done=0;arr.forEach(l=>{if(state[key(s,l.n)])done++});r[s]={done,total:arr.length};td+=done;tt+=arr.length}r.__all__={done:td,total:tt};return r}
function renderDday(){const el=document.getElementById("dday"),de=document.getElementById("examDate");if(!examDate){el.textContent="D-—";de.textContent="시험 날짜를 정해주세요";return}const t=new Date();t.setHours(0,0,0,0);const ex=new Date(examDate+"T00:00:00");const diff=Math.round((ex-t)/86400000);el.textContent=diff>0?("D-"+diff):diff===0?"D-DAY":("D+"+(-diff));const wd=["일","월","화","수","목","금","토"][ex.getDay()];de.textContent=`${ex.getFullYear()}. ${ex.getMonth()+1}. ${ex.getDate()}. (${wd}) 시험`}
function renderLec(){
  const c=counts();document.getElementById("overallDone").textContent=c.__all__.done;document.getElementById("overallTotal").textContent=c.__all__.total;document.getElementById("overallPct").textContent=(c.__all__.total?Math.round(c.__all__.done/c.__all__.total*100):0)+"%";
  const cards=document.getElementById("cards");cards.innerHTML="";for(const s of SUBJECTS){const{done,total}=c[s];const pct=total?Math.round(done/total*100):0;const d=document.createElement("div");d.className="card";d.innerHTML=`<div class="top"><div class="name">${s}</div><div class="frac">${done} / ${total}강</div></div><div class="bar"><i style="width:${pct}%"></i></div><div class="pctlab">${pct}% 완료 · ${total-done}강 남음</div>`;cards.appendChild(d)}
  const t=document.getElementById("tabs");t.innerHTML="";for(const s of SUBJECTS){const b=document.createElement("button");b.className="tab"+(s===curSubject?" on":"");b.textContent=`${s} ${c[s].done}/${c[s].total}`;b.onclick=()=>{curSubject=s;query="";document.getElementById("search").value="";renderLec()};t.appendChild(b)}
  const list=document.getElementById("list");list.innerHTML="";const q=query.trim().toLowerCase();const items=(LECT[curSubject]||[]).filter(l=>!q||(l.n+" "+l.t).toLowerCase().includes(q));if(!items.length){list.innerHTML='<div class="empty">'+(q?'검색 결과가 없어요':'강의를 불러오는 중…')+'</div>';return}
  for(const l of items){const done=!!state[key(curSubject,l.n)];const row=document.createElement("div");row.className="row"+(done?" done":"");row.innerHTML=`<div class="num">${l.n}</div><div class="title">${esc(l.t)}</div><div class="check">✓</div>`;row.onclick=()=>toggle(curSubject,l.n);list.appendChild(row)}
}
function toggle(s,n){const k=key(s,n),now=!state[k];if(now)state[k]=true;else delete state[k];save(LKEY,state);renderLec();pushProgress(s,n,now)}

/* 독서: 페이지별 읽은 횟수 */
function bookLogs(id){return LOGS.filter(l=>l.book_id===id).sort((a,b)=>(a.id>b.id?1:-1))}
function pageCounts(b){const n=b.total_pages||0;const cnt=new Array(n+1).fill(0);bookLogs(b.id).forEach(l=>{const a=Math.max(1,l.page_from||1),z=Math.min(n,l.page_to||0);for(let p=a;p<=z;p++)cnt[p]++});return cnt}
function readStats(b){const n=b.total_pages||0;const cnt=pageCounts(b);let mx=0,minc=n?Infinity:0;for(let p=1;p<=n;p++){mx=Math.max(mx,cnt[p]);minc=Math.min(minc,cnt[p])}if(minc===Infinity)minc=0;
  const levels=[];for(let k=1;k<=Math.max(mx,1);k++){let c=0;for(let p=1;p<=n;p++)if(cnt[p]>=k)c++;levels.push(c)}
  const today=todayStr();const todayPages=bookLogs(b.id).filter(l=>l.log_date===today).reduce((s,l)=>s+Math.max(0,((l.page_to||0)-(l.page_from||0)+1)),0);
  const lastEnd=bookLogs(b.id).reduce((m,l)=>Math.max(m,l.page_to||0),0);
  return{n,cnt,mx,minc,levels,todayPages,lastEnd}}
function heatColor(c){return HEAT[Math.min(c,HEAT.length-1)]}
function heatmap(b,cls,cols){const st=readStats(b);const n=st.n;if(!n)return `<div class="${cls}"></div>`;cols=Math.min(cols||120,n);const per=n/cols;let h=`<div class="${cls}">`;for(let i=0;i<cols;i++){const a=Math.floor(i*per)+1,z=Math.max(a,Math.floor((i+1)*per));let m=Infinity;for(let p=a;p<=z;p++)m=Math.min(m,st.cnt[p]||0);if(m===Infinity)m=0;h+=`<span style="background:${heatColor(m)}"></span>`}return h+"</div>"}
function chapterFor(bid,from,to){const ch=CHAPTERS[bid];if(!ch||!ch.length)return"";const hit=[];for(let i=0;i<ch.length;i++){const s=ch[i].start,e=(i+1<ch.length?ch[i+1].start-1:1e9);if(s<=to&&e>=from)hit.push(ch[i].title)}if(!hit.length)return"";return hit.length<=2?hit.join(", "):hit[0]+" 외 "+(hit.length-1)+"개 장"}
function heatRuler(b){const n=(b.total_pages||0);if(!n)return"";let t="";for(let p=10;p<n;p+=10){const left=p/n*100;const maj=(p%100===0);t+=`<span class="tick${maj?' maj':''}" style="left:${left}%"></span>`;if(maj)t+=`<span class="tlab" style="left:${left}%">${p}</span>`}t+=`<span class="tick maj" style="left:100%"></span><span class="tlab end" style="left:100%">${n}</span>`;return `<div class="ruler">${t}</div>`}
function tocHTML(b){const ch=CHAPTERS[b.id];if(!ch||!ch.length)return `<div class="detbox"><div class="hd"><span>🗂 목차</span></div><div style="color:var(--sub);font-size:13px">목차 정보가 없어요.</div></div>`;
  const st=readStats(b);const n=st.n;let rows="";
  ch.forEach((c,i)=>{const s=c.start,e=(i+1<ch.length?ch[i+1].start-1:n);let mn=Infinity,cov=0,tot=0;for(let p=Math.max(1,s);p<=Math.min(n,e);p++){tot++;const v=st.cnt[p]||0;mn=Math.min(mn,v);if(v>=1)cov++}if(mn===Infinity){mn=0;tot=0}
    const badge=tot&&mn>=1?`<span class="tocb done">✓${mn}번</span>`:(cov>0?`<span class="tocb">${Math.round(cov/Math.max(tot,1)*100)}%</span>`:`<span class="tocb zero">-</span>`);
    rows+=`<div class="tocrow"><span class="tocdot" style="background:${heatColor(mn)}"></span><span class="toct">${esc(c.title)}</span><span class="tocp">p.${s}~${e}</span>${badge}</div>`});
  return `<div class="detbox"><div class="hd"><span>🗂 목차</span><span class="sum" style="color:var(--sub);font-weight:600">${ch.length}개 장 · 색=읽은 횟수</span></div>${rows}</div>`}
function coverCell(b,cls,ph){if(b.cover_url)return `<img class="${cls}" src="${esc(b.cover_url)}" onerror="this.outerHTML='<div class=\'${ph}\'>'+this.alt+'</div>'" alt="${esc(b.title)}">`;return `<div class="${ph}">${esc(b.title)}</div>`}

function renderGrid(){
  const grid=document.getElementById("bgrid");grid.innerHTML="";let todayTotal=0;
  BOOKS.forEach(b=>{const st=readStats(b);todayTotal+=st.todayPages;const n=st.n||1;
    const p1=Math.round((st.levels[0]||0)/n*100);const p2=st.levels[1]?Math.round(st.levels[1]/n*100):0;
    const c=document.createElement("div");c.className="bcard";
    c.innerHTML=`${coverCell(b,'bcover','bcoverph')}<div class="bbody"><div class="btitle">${esc(b.title)}</div><div class="bmeta">${esc(b.author||'')}${b.publisher?' · '+esc(b.publisher):''}</div>${heatmap(b,'heatmini',60)}<div class="bpct">1회독 ${p1}%${p2?` · 2회독 ${p2}%`:''}</div>${st.todayPages?`<div class="btoday">오늘 +${st.todayPages}쪽</div>`:''}</div>`;
    c.onclick=()=>{location.hash="#book/"+b.id};grid.appendChild(c)});
  document.getElementById("todayChip").textContent=`오늘 ${todayTotal}쪽`;
}
function renderDetail(b){
  const st=readStats(b);const n=st.n||1;const d=document.getElementById("bookDetail");
  const legend=`<div class="legend"><span><i style="background:${HEAT[0]}"></i>안읽음</span><span><i style="background:${HEAT[1]}"></i>1번</span><span><i style="background:${HEAT[2]}"></i>2번</span><span><i style="background:${HEAT[3]}"></i>3번</span><span><i style="background:${HEAT[4]}"></i>4번+</span></div>`;
  let lvls="";for(let k=1;k<=Math.max(st.mx,1);k++){const c=st.levels[k-1]||0;const pc=Math.round(c/n*100);lvls+=`<div class="lvlrow"><span class="lb">${k}회독</span><div class="bar"><i style="width:${pc}%"></i></div><span class="pc">${c}/${n}쪽 (${pc}%)</span></div>`}
  const doneMsg=st.minc>=1?`📗 완독 ${st.minc}회 — 모든 쪽을 최소 ${st.minc}번 읽었어요`:`아직 안 읽은 곳이 있어요 (안읽음 ${n-(st.levels[0]||0)}쪽)`;
  const ls=bookLogs(b.id).slice().reverse().slice(0,25);
  const hist=ls.length?ls.map(l=>{const ch=chapterFor(b.id,l.page_from,l.page_to);return `<div class="histitem"><div class="hl"><b>${l.page_from}~${l.page_to}쪽</b> <span class="hd2">· ${l.log_date}</span>${ch?`<div class="hc">📖 ${esc(ch)}</div>`:''}</div><button class="x" data-id="${l.id}">🗑</button></div>`}).join(""):'<div style="color:var(--sub);font-size:13px;padding:8px 0">아직 기록이 없어요. 오늘 읽은 만큼 위에 적어보세요!</div>';
  d.innerHTML=`
    <button class="back" id="backGrid">← 책장으로</button>
    <div class="dethead">${coverCell(b,'dcover','ph')}<div class="di"><b>${esc(b.title)}</b><span>${esc(b.author||'')}${b.publisher?' · '+esc(b.publisher):''}</span><span>총 ${b.total_pages||'?'}쪽</span></div></div>
    <div class="detbox">
      <div class="hd"><span>📊 페이지별 읽은 횟수</span><span class="sum">${doneMsg.startsWith('📗')?'완독 '+st.minc+'회':''}</span></div>
      ${heatmap(b,'heat',130)}${heatRuler(b)}${legend}
      <div style="margin-top:16px">${lvls}</div>
      <div style="margin-top:14px;font-weight:800;font-size:14px">${doneMsg}</div>
    </div>
    <div class="detbox logcard">
      <h3>✍️ 오늘 읽은 만큼 기록</h3>
      <div class="desc">읽은 쪽 범위만 넣으면 돼요. 다시 읽으면 그 구간이 <b>더 진하게</b> 쌓여요.</div>
      <div class="field"><label>날짜</label><input type="date" id="lgDate" value="${todayStr()}"></div>
      <div class="field"><label>읽은 쪽 (시작 ~ 끝)</label><div class="pagepair"><input type="number" id="lgFrom" inputmode="numeric" value="${st.lastEnd?st.lastEnd+1:1}"><span class="tilde">~</span><input type="number" id="lgTo" inputmode="numeric" placeholder="끝 쪽"></div></div>
      <div class="chappreview" id="chapPrev"></div>
      <button class="savebtn" id="saveLog">기록 저장</button>
    </div>
    <div class="detbox"><div class="hd"><span>📚 읽은 기록</span></div>${hist}</div>
    ${tocHTML(b)}`;
  d.querySelector("#backGrid").onclick=()=>{location.hash="#books"};
  d.querySelector("#saveLog").onclick=()=>saveLog(b);
  const upd=()=>{const f=parseInt(d.querySelector("#lgFrom").value),t=parseInt(d.querySelector("#lgTo").value);const ch=(f&&t&&t>=f)?chapterFor(b.id,f,t):"";d.querySelector("#chapPrev").textContent=ch?`📖 이 범위: ${ch}`:""};
  d.querySelector("#lgFrom").addEventListener("input",upd);d.querySelector("#lgTo").addEventListener("input",upd);
  d.querySelectorAll(".histitem .x").forEach(x=>x.onclick=()=>delLog(b,x.dataset.id));
}
async function saveLog(b){
  const dt=document.getElementById("lgDate").value||todayStr();
  const from=parseInt(document.getElementById("lgFrom").value),to=parseInt(document.getElementById("lgTo").value);
  if(!from||!to||to<from){alert("시작 쪽과 끝 쪽을 확인해주세요. (끝 쪽이 시작보다 커야 해요)");return}
  const rec={book_id:b.id,log_date:dt,page_from:from,page_to:to,round:1};
  const tmp={...rec,id:"tmp"+Date.now()};LOGS.push(tmp);save(GKEY,LOGS);renderDetail(b);renderGrid();
  if(sb&&online){try{const {data}=await sb.from("imyong_reading_log").insert(rec).select().single();if(data){LOGS=LOGS.filter(l=>l.id!==tmp.id);LOGS.push(data);save(GKEY,LOGS);renderDetail(b);renderGrid()}}catch(e){console.warn(e)}}
}
async function delLog(b,id){if(!confirm("이 기록을 지울까요?"))return;LOGS=LOGS.filter(l=>String(l.id)!==String(id));save(GKEY,LOGS);renderDetail(b);renderGrid();
  if(sb&&online&&!String(id).startsWith("tmp")){try{await sb.from("imyong_reading_log").delete().eq("id",id)}catch(e){}}
}

/* 라우팅 */
function route(){
  renderDday();renderLec();renderGrid();
  const m=location.hash.match(/^#book\/(.+)$/);
  const book=m?BOOKS.find(x=>x.id===decodeURIComponent(m[1])):null;
  if(book){mode="books";curBook=book;document.getElementById("bookGrid").className="hide";document.getElementById("bookDetail").className="";renderDetail(book);}
  else{if(/^#books$/.test(location.hash)||/mode=book/.test(location.search))mode="books";curBook=null;document.getElementById("bookGrid").className="";document.getElementById("bookDetail").className="hide";}
  document.getElementById("secLec").className=mode==="lectures"?"":"hide";
  document.getElementById("secBook").className=mode==="books"?"":"hide";
  document.getElementById("modeLec").className="modebtn"+(mode==="lectures"?" on":"");
  document.getElementById("modeBook").className="modebtn"+(mode==="books"?" on":"");
}
window.addEventListener("hashchange",route);
document.getElementById("modeLec").onclick=()=>{mode="lectures";location.hash="";history.replaceState(null,"",location.pathname+location.search);route()};
document.getElementById("modeBook").onclick=()=>{location.hash="#books"};
document.getElementById("homeTitle").onclick=()=>{mode="lectures";location.hash="";history.replaceState(null,"",location.pathname+location.search);route()};
document.getElementById("editDate").onclick=()=>{document.getElementById("dateInput").value=examDate||"";document.getElementById("dateModal").classList.add("show")};
document.getElementById("cancelDate").onclick=()=>document.getElementById("dateModal").classList.remove("show");
document.getElementById("saveDate").onclick=()=>{const v=document.getElementById("dateInput").value;if(v){examDate=v;localStorage.setItem(DKEY,v);pushExamDate(v);renderDday()}document.getElementById("dateModal").classList.remove("show")};
document.getElementById("dateModal").onclick=e=>{if(e.target.id==="dateModal")document.getElementById("dateModal").classList.remove("show")};
document.getElementById("search").addEventListener("input",e=>{query=e.target.value;renderLec()});
document.getElementById("foot").innerHTML="강의는 맥 <b>임용강의 앱</b>으로 보고, 여기선 진도·독서를 기록해요. · 모든 기록은 자동 동기화됩니다.";
route();initSB();setInterval(renderDday,3600000);checkUpdate();setInterval(checkUpdate,120000);
</script>
